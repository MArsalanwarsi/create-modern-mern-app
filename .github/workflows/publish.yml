name: Publish to npm

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  packed:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        starter: [default, tailwind, minimal]
    services:
      mongo:
        # MongoDB 8.x can abort on hosted runner kernels (SERVER-121912).
        image: mongo:7.0.45@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --host 127.0.0.1 --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.16.0'
      - run: npm ci
      - name: Install Chrome for the production navigation test
        if: matrix.starter == 'default'
        run: npx --no-install playwright install --with-deps chrome
      - run: npm run test:packed -- ${{ matrix.starter }}
        env:
          TEST_BROWSER: '1'
          TEST_MONGO_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}
      - name: Show MongoDB service diagnostics on failure
        if: failure()
        env:
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
        run: |
          docker inspect --format '{{json .State}}' "$MONGO_CONTAINER"
          docker port "$MONGO_CONTAINER"
          docker logs --tail 80 "$MONGO_CONTAINER"

  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run lint

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, packed]
    runs-on: ubuntu-24.04
    concurrency:
      group: npm-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Bump patch, push release tag and publish the tarball
        id: publish
        run: bash scripts/release.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public install
        if: steps.publish.outputs.version != ''
        timeout-minutes: 9
        env:
          RELEASE_VERSION: ${{ steps.publish.outputs.version }}
        run: bash scripts/verify-public-install.sh "$RELEASE_VERSION"
