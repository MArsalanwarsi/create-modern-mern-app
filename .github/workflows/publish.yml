name: Publish to npm

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  packed:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        starter: [default, tailwind, minimal]
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - run: npm ci
      - name: Install Chrome for the production navigation test
        if: matrix.starter == 'default'
        run: npx --no-install playwright install --with-deps chrome
      - run: npm run test:packed -- ${{ matrix.starter }}
        env:
          TEST_BROWSER: '1'
          TEST_MONGO_URI: mongodb://127.0.0.1:27017

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run lint

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, packed]
    runs-on: ubuntu-latest
    concurrency:
      group: npm-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Bump patch, push release tag and publish the tarball
        run: bash scripts/release.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
